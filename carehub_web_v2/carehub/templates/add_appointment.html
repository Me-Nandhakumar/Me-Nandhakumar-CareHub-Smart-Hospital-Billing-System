{% extends "base.html" %}
{% block title %}Book Appointment{% endblock %}
{% block content %}
<div class="page-header">
  <h2>📅 Book New Appointment</h2>
</div>

<div class="form-card">
  <form method="POST" id="apptForm">
    <div class="form-grid">
      <div class="form-group">
        <label>Patient Name *</label>
        <input type="text" name="patient_name" placeholder="Full name" required>
      </div>
      <div class="form-group">
        <label>Contact Number *</label>
        <input type="tel" name="contact" placeholder="10-digit mobile" pattern="[0-9]{10}" maxlength="10" required>
      </div>
      <div class="form-group">
        <label>Select Doctor *</label>
        <select name="doctor" id="doctorSelect" onchange="setDept(this)" required>
          <option value="">-- Select Doctor --</option>
          {% for doc, dept in doctors %}
          <option value="{{ doc }}" data-dept="{{ dept }}">{{ doc }} ({{ dept }})</option>
          {% endfor %}
        </select>
      </div>
      <div class="form-group">
        <label>Department</label>
        <input type="text" name="department" id="deptField" placeholder="Auto-filled on doctor select" readonly>
      </div>
      <div class="form-group">
        <label>Appointment Date *</label>
        <input type="date" name="appt_date" id="apptDate" required>
      </div>
      <div class="form-group">
        <label>Appointment Time *</label>
        <select name="appt_time" required>
          <option value="">-- Select Time --</option>
          <option>09:00 AM</option><option>09:30 AM</option>
          <option>10:00 AM</option><option>10:30 AM</option>
          <option>11:00 AM</option><option>11:30 AM</option>
          <option>12:00 PM</option><option>12:30 PM</option>
          <option>02:00 PM</option><option>02:30 PM</option>
          <option>03:00 PM</option><option>03:30 PM</option>
          <option>04:00 PM</option><option>04:30 PM</option>
          <option>05:00 PM</option>
        </select>
      </div>
      <div class="form-group full-width">
        <label>Reason / Chief Complaint</label>
        <input type="text" name="reason" placeholder="e.g. Routine checkup, Fever for 3 days...">
      </div>
    </div>
    <div class="form-actions">
      <a href="{{ url_for('appointments') }}" class="btn-secondary">Cancel</a>
      <button type="submit" class="btn-primary">📅 Book & Send WhatsApp →</button>
    </div>
  </form>
</div>

<script>
  // Set min date to today
  document.getElementById("apptDate").min = new Date().toISOString().split("T")[0];

  function setDept(sel) {
    const opt = sel.options[sel.selectedIndex];
    document.getElementById("deptField").value = opt.dataset.dept || "";
  }
</script>
{% endblock %}
