{% extends "base.html" %}
{% block title %}Add Patient{% endblock %}
{% block content %}
<div class="page-header">
  <h2>📝 Register New Patient</h2>
</div>

<div class="form-card">
  <form method="POST" id="patientForm">
    <div class="form-grid">
      <div class="form-group">
        <label>Patient Name *</label>
        <input type="text" name="name" placeholder="Full name" required>
      </div>
      <div class="form-group">
        <label>Age *</label>
        <input type="number" name="age" placeholder="Age in years" min="0" max="150" required>
      </div>
      <div class="form-group">
        <label>Gender *</label>
        <select name="gender" required>
          <option value="">Select Gender</option>
          <option value="male">Male</option>
          <option value="female">Female</option>
          <option value="other">Other</option>
        </select>
      </div>
      <div class="form-group">
        <label>Weight (kg) *</label>
        <input type="number" name="weight" placeholder="Weight in kg" min="1" required>
      </div>
      <div class="form-group">
        <label>Contact Number *</label>
        <input type="tel" name="contact" placeholder="10-digit mobile number" pattern="[0-9]{10}" maxlength="10" required>
      </div>
      <div class="form-group">
        <label>Payment Mode *</label>
        <select name="payment_mode" required>
          <option value="Cash">💵 Cash</option>
          <option value="GPay">📲 GPay (QR Code)</option>
        </select>
      </div>
    </div>

    <div class="form-group full-width">
      <label>Symptoms * (select all that apply)</label>
      <div class="symptoms-grid">
        {% for s in symptoms %}
        <label class="symptom-checkbox">
          <input type="checkbox" name="symptoms" value="{{ s }}">
          <span class="symptom-label">{{ s.title() }}</span>
        </label>
        {% endfor %}
      </div>
    </div>

    <div class="form-actions">
      <a href="{{ url_for('dashboard') }}" class="btn-secondary">Cancel</a>
      <button type="submit" class="btn-primary">Generate Bill →</button>
    </div>
  </form>
</div>

<script>
document.getElementById("patientForm").addEventListener("submit", function(e) {
  const checked = document.querySelectorAll('input[name="symptoms"]:checked');
  if (checked.length === 0) {
    e.preventDefault();
    alert("Please select at least one symptom.");
  }
});
</script>
{% endblock %}
