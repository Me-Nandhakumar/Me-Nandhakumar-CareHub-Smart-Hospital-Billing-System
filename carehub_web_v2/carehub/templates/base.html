<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}CareHub{% endblock %} 🏥</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  {% if session.admin %}
  <nav class="navbar">
    <div class="nav-brand">🏥 CareHub</div>
    <div class="nav-links">
      <a href="{{ url_for('dashboard') }}" class="{{ 'active' if request.endpoint == 'dashboard' }}">Dashboard</a>
      <a href="{{ url_for('add_patient') }}" class="{{ 'active' if request.endpoint == 'add_patient' }}">Add Patient</a>
      <a href="{{ url_for('patients') }}" class="{{ 'active' if request.endpoint == 'patients' }}">Patients</a>
      <a href="{{ url_for('appointments') }}" class="{{ 'active' if request.endpoint in ['appointments','add_appointment'] }}">📅 Appointments</a>
      <a href="{{ url_for('logout') }}" class="logout-btn">Logout</a>
    </div>
  </nav>
  {% endif %}
  <div class="main-content">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
        <div class="alert alert-{{ cat }}">{{ msg }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </div>
</body>
</html>
